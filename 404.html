<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AIDO Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Schibsted+Grotesk:wght@400;500&display=swap">
<style>
:root{--bg:#fbfbfa;--ink:#1f1e1c;--muted:#6b6862;--line:#e7e5e0;--accent:#2f5d50;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#191918;--ink:#ecebe8;--muted:#a8a49c;--line:#2f2e2c;--accent:#8cc3ae;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px 16px}
main{max-width:30rem;display:grid;gap:14px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:2rem;margin:0;line-height:1.1}
p{margin:0;color:var(--muted);line-height:1.5}
a.btn{justify-self:start;display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:8px;padding:10px 16px;font-weight:500}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
small{color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
<script>
  // Lleva a la herramienta conservando el #ancla (los pendientes que llegan desde la Bandeja usan #pend-…).
  var DESTINO = "https://claude.ai/artifact/Lowcbtm1UCMbfj9HmoAkbE";
  var h = location.hash && /^#[A-Za-z0-9._~-]+$/.test(location.hash) ? location.hash : "";
  location.replace(DESTINO + h);
</script>
</head>
<body>
<main>
  <h1>AIDO Operaciones</h1>
  <p>Te llevamos a la herramienta de producción del equipo.</p>
  <a class="btn" href="https://claude.ai/artifact/Lowcbtm1UCMbfj9HmoAkbE">Entrar</a>
  <small>Se abre con tu cuenta de claude.ai, la del email al que te invitó Manel.</small>
</main>
</body>
</html>
